<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="100%" height="100%">
  <!-- Vinyl record icon -->
  <g transform="translate(10, 0)">
    <!-- Outer record disc -->
    <circle cx="60" cy="60" r="48" fill="#18181b" stroke="#27272a" stroke-width="1.5" />
    
    <!-- Sound grooves -->
    <circle cx="60" cy="60" r="38" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.12" />
    <circle cx="60" cy="60" r="28" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.12" />
    
    <!-- Record label (green) -->
    <circle cx="60" cy="60" r="18" fill="#1db954" />
    
    <!-- Inner label groove -->
    <circle cx="60" cy="60" r="14" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.3" />
    
    <!-- Center spindle hole -->
    <circle cx="60" cy="60" r="4" fill="#09090b" />
  </g>
  
  <!-- Text "Albumboxd" -->
  <text x="135" y="72" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-weight="900" font-size="46" letter-spacing="-1.5px">
    <tspan fill="#ffffff">Album</tspan><tspan fill="#1db954">boxd</tspan>
  </text>
</svg>